<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Ibadan skyline with Cocoa House and traditional Yoruba architecture">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a1f10"/>
      <stop offset="60%"  stop-color="#1a3a22"/>
      <stop offset="100%" stop-color="#2a5a34"/>
    </linearGradient>
    <linearGradient id="sunGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#e8b84b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8b84b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rg1" cx="70%" cy="35%" r="35%">
      <stop offset="0%"   stop-color="#c8860a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c8860a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1a3a22"/>
      <stop offset="100%" stop-color="#0a1f10"/>
    </linearGradient>
    <linearGradient id="cocoa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#c8860a"/>
      <stop offset="40%" stop-color="#2a5040"/>
      <stop offset="100%" stop-color="#0f2e1a"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1e4a2e"/>
      <stop offset="100%" stop-color="#0a1f10"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="480" fill="url(#sky)"/>
  <rect width="1200" height="480" fill="url(#rg1)"/>

  <!-- Stars -->
  <g fill="#e8b84b" opacity="0.6">
    <circle cx="80"  cy="50"  r="1.2"/><circle cx="150" cy="30"  r="1"/><circle cx="240" cy="60"  r="1.5"/>
    <circle cx="320" cy="25"  r="1"/><circle cx="410" cy="45"  r="1.2"/><circle cx="500" cy="20"  r="1"/>
    <circle cx="600" cy="55"  r="1.5"/><circle cx="680" cy="35"  r="1"/><circle cx="760" cy="15"  r="1.2"/>
    <circle cx="850" cy="50"  r="1"/><circle cx="940" cy="28"  r="1.5"/><circle cx="1050" cy="40" r="1"/>
    <circle cx="1130" cy="18" r="1.2"/><circle cx="200" cy="80" r="1"/><circle cx="900" cy="70" r="1"/>
  </g>

  <!-- Moon -->
  <circle cx="1050" cy="70" r="28" fill="#f5e8a0" opacity="0.9" filter="url(#glow)"/>
  <circle cx="1062" cy="62" r="22" fill="#1a3a22"/>

  <!-- Distant hills -->
  <ellipse cx="200"  cy="480" rx="340" ry="160" fill="#122a1a" opacity="0.8"/>
  <ellipse cx="600"  cy="490" rx="420" ry="145" fill="#0e2216" opacity="0.7"/>
  <ellipse cx="1000" cy="475" rx="360" ry="155" fill="#132b1c" opacity="0.8"/>

  <!-- Ground -->
  <rect x="0" y="360" width="1200" height="120" fill="url(#ground)"/>

  <!-- Background buildings (distant) -->
  <rect x="50"  y="300" width="35" height="80"  fill="#152e1a" opacity="0.7"/>
  <rect x="95"  y="285" width="28" height="95"  fill="#1a3520" opacity="0.7"/>
  <rect x="130" y="310" width="40" height="70"  fill="#122818" opacity="0.7"/>
  <rect x="1050" y="305" width="38" height="75" fill="#152e1a" opacity="0.7"/>
  <rect x="1095" y="290" width="30" height="90" fill="#1a3520" opacity="0.7"/>
  <rect x="1130" y="315" width="45" height="65" fill="#122818" opacity="0.7"/>

  <!-- Mid-ground buildings left cluster -->
  <rect x="30"  y="250" width="55" height="130" fill="#1e4a2e" opacity="0.85"/>
  <rect x="92"  y="235" width="48" height="145" fill="#1a4228" opacity="0.85"/>
  <rect x="147" y="260" width="60" height="120" fill="#1e4a2e" opacity="0.85"/>
  <!-- Windows -->
  <g fill="#e8b84b" opacity="0.3">
    <rect x="40"  y="260" width="6" height="5"/><rect x="52"  y="260" width="6" height="5"/>
    <rect x="40"  y="272" width="6" height="5"/><rect x="52"  y="272" width="6" height="5"/>
    <rect x="40"  y="284" width="6" height="5"/><rect x="52"  y="284" width="6" height="5"/>
    <rect x="100" y="245" width="6" height="5"/><rect x="113" y="245" width="6" height="5"/>
    <rect x="100" y="258" width="6" height="5"/><rect x="113" y="258" width="6" height="5"/>
  </g>

  <!-- Mid-ground buildings right cluster -->
  <rect x="980"  y="245" width="60" height="135" fill="#1e4a2e" opacity="0.85"/>
  <rect x="1047" y="255" width="50" height="125" fill="#1a4228" opacity="0.85"/>
  <rect x="1104" y="240" width="65" height="140" fill="#1e4a2e" opacity="0.85"/>
  <g fill="#e8b84b" opacity="0.3">
    <rect x="990"  y="255" width="6" height="5"/><rect x="1002" y="255" width="6" height="5"/>
    <rect x="990"  y="268" width="6" height="5"/><rect x="1002" y="268" width="6" height="5"/>
    <rect x="1057" y="265" width="6" height="5"/><rect x="1069" y="265" width="6" height="5"/>
  </g>

  <!-- MAPO HALL (center-left, domed civic building) -->
  <rect x="340" y="255" width="120" height="125" fill="#1a4228"/>
  <!-- Columns -->
  <rect x="350" y="255" width="8"  height="85" fill="#2a6040"/>
  <rect x="365" y="255" width="8"  height="85" fill="#2a6040"/>
  <rect x="380" y="255" width="8"  height="85" fill="#2a6040"/>
  <rect x="395" y="255" width="8"  height="85" fill="#2a6040"/>
  <rect x="410" y="255" width="8"  height="85" fill="#2a6040"/>
  <rect x="425" y="255" width="8"  height="85" fill="#2a6040"/>
  <rect x="440" y="255" width="8"  height="85" fill="#2a6040"/>
  <!-- Entablature -->
  <rect x="340" y="245" width="120" height="14" fill="#2a6040"/>
  <!-- Dome base -->
  <rect x="360" y="210" width="80" height="38" fill="#1e5030"/>
  <!-- Dome -->
  <ellipse cx="400" cy="210" rx="48" ry="30" fill="#c8860a" opacity="0.85"/>
  <ellipse cx="400" cy="210" rx="38" ry="22" fill="#e8b84b" opacity="0.4"/>
  <!-- Dome finial -->
  <rect x="397" y="178" width="6" height="34" fill="#c8860a"/>
  <circle cx="400" cy="176" r="5" fill="#e8b84b"/>
  <!-- Flag on Mapo -->
  <rect x="400" y="155" width="2" height="22" fill="#c8860a"/>
  <rect x="402" y="155" width="16" height="10" fill="#1a8a40"/>

  <!-- COCOA HOUSE (center, tall distinctive skyscraper) -->
  <!-- Base podium -->
  <rect x="530" y="300" width="140" height="80" fill="#0f2e1a"/>
  <!-- Main tower -->
  <rect x="555" y="130" width="90"  height="180" fill="url(#cocoa)"/>
  <!-- Setbacks -->
  <rect x="560" y="110" width="80"  height="28"  fill="#2a5040"/>
  <rect x="568" y="90"  width="64"  height="26"  fill="#1a3a30"/>
  <rect x="575" y="72"  width="50"  height="24"  fill="#c8860a" opacity="0.9"/>
  <!-- Top antenna -->
  <rect x="598" y="38"  width="4"   height="36"  fill="#e8b84b"/>
  <circle cx="600" cy="36" r="4" fill="#fff" opacity="0.9" filter="url(#glow)"/>
  <!-- Cocoa House windows – characteristic grid -->
  <g fill="#e8b84b" opacity="0.5">
    <rect x="562" y="140" width="8" height="6"/><rect x="576" y="140" width="8" height="6"/><rect x="590" y="140" width="8" height="6"/><rect x="604" y="140" width="8" height="6"/><rect x="618" y="140" width="8" height="6"/>
    <rect x="562" y="153" width="8" height="6"/><rect x="576" y="153" width="8" height="6"/><rect x="590" y="153" width="8" height="6"/><rect x="604" y="153" width="8" height="6"/><rect x="618" y="153" width="8" height="6"/>
    <rect x="562" y="166" width="8" height="6"/><rect x="576" y="166" width="8" height="6"/><rect x="590" y="166" width="8" height="6"/><rect x="604" y="166" width="8" height="6"/><rect x="618" y="166" width="8" height="6"/>
    <rect x="562" y="179" width="8" height="6"/><rect x="576" y="179" width="8" height="6"/><rect x="590" y="179" width="8" height="6"/><rect x="604" y="179" width="8" height="6"/><rect x="618" y="179" width="8" height="6"/>
    <rect x="562" y="192" width="8" height="6"/><rect x="576" y="192" width="8" height="6"/><rect x="590" y="192" width="8" height="6"/><rect x="604" y="192" width="8" height="6"/><rect x="618" y="192" width="8" height="6"/>
    <rect x="562" y="205" width="8" height="6"/><rect x="576" y="205" width="8" height="6"/><rect x="590" y="205" width="8" height="6"/><rect x="604" y="205" width="8" height="6"/><rect x="618" y="205" width="8" height="6"/>
    <rect x="562" y="218" width="8" height="6"/><rect x="576" y="218" width="8" height="6"/><rect x="590" y="218" width="8" height="6"/><rect x="604" y="218" width="8" height="6"/><rect x="618" y="218" width="8" height="6"/>
    <rect x="562" y="231" width="8" height="6"/><rect x="576" y="231" width="8" height="6"/><rect x="590" y="231" width="8" height="6"/><rect x="604" y="231" width="8" height="6"/><rect x="618" y="231" width="8" height="6"/>
    <rect x="562" y="244" width="8" height="6"/><rect x="576" y="244" width="8" height="6"/><rect x="590" y="244" width="8" height="6"/><rect x="604" y="244" width="8" height="6"/><rect x="618" y="244" width="8" height="6"/>
    <rect x="562" y="257" width="8" height="6"/><rect x="576" y="257" width="8" height="6"/><rect x="590" y="257" width="8" height="6"/><rect x="604" y="257" width="8" height="6"/><rect x="618" y="257" width="8" height="6"/>
    <rect x="562" y="270" width="8" height="6"/><rect x="576" y="270" width="8" height="6"/><rect x="590" y="270" width="8" height="6"/><rect x="604" y="270" width="8" height="6"/><rect x="618" y="270" width="8" height="6"/>
    <rect x="562" y="283" width="8" height="6"/><rect x="576" y="283" width="8" height="6"/><rect x="590" y="283" width="8" height="6"/><rect x="604" y="283" width="8" height="6"/><rect x="618" y="283" width="8" height="6"/>
  </g>
  <!-- Podium entrance -->
  <rect x="575" y="335" width="50" height="45" fill="#0a1f10"/>
  <rect x="585" y="338" width="12" height="20" fill="#e8b84b" opacity="0.25"/>
  <rect x="603" y="338" width="12" height="20" fill="#e8b84b" opacity="0.25"/>

  <!-- UI TOWER (right of center, University of Ibadan tower) -->
  <rect x="760" y="220" width="80"  height="160" fill="url(#bldg)"/>
  <rect x="770" y="195" width="60"  height="30"  fill="#1a4228"/>
  <rect x="778" y="175" width="44"  height="26"  fill="#1e4a30"/>
  <rect x="785" y="158" width="30"  height="22"  fill="#c8860a" opacity="0.7"/>
  <rect x="798" y="138" width="4"   height="22"  fill="#e8b84b"/>
  <!-- UI windows -->
  <g fill="#e8b84b" opacity="0.35">
    <rect x="768" y="228" width="7" height="5"/><rect x="782" y="228" width="7" height="5"/><rect x="796" y="228" width="7" height="5"/><rect x="810" y="228" width="7" height="5"/>
    <rect x="768" y="242" width="7" height="5"/><rect x="782" y="242" width="7" height="5"/><rect x="796" y="242" width="7" height="5"/><rect x="810" y="242" width="7" height="5"/>
    <rect x="768" y="256" width="7" height="5"/><rect x="782" y="256" width="7" height="5"/><rect x="796" y="256" width="7" height="5"/><rect x="810" y="256" width="7" height="5"/>
    <rect x="768" y="270" width="7" height="5"/><rect x="782" y="270" width="7" height="5"/><rect x="796" y="270" width="7" height="5"/><rect x="810" y="270" width="7" height="5"/>
    <rect x="768" y="284" width="7" height="5"/><rect x="782" y="284" width="7" height="5"/><rect x="796" y="284" width="7" height="5"/><rect x="810" y="284" width="7" height="5"/>
    <rect x="768" y="298" width="7" height="5"/><rect x="782" y="298" width="7" height="5"/><rect x="796" y="298" width="7" height="5"/><rect x="810" y="298" width="7" height="5"/>
  </g>

  <!-- Foreground palm trees -->
  <g opacity="0.9">
    <!-- Palm 1 -->
    <rect x="198" y="330" width="5" height="80" fill="#0a1f10" transform="rotate(-3,200,380)"/>
    <ellipse cx="198" cy="325" rx="30" ry="12" fill="#1a5a28" transform="rotate(-20,198,325)"/>
    <ellipse cx="210" cy="318" rx="28" ry="10" fill="#1a5a28" transform="rotate(15,210,318)"/>
    <ellipse cx="185" cy="320" rx="26" ry="9"  fill="#1a5a28" transform="rotate(-35,185,320)"/>
    <ellipse cx="200" cy="312" rx="22" ry="8"  fill="#2d6b40" transform="rotate(5,200,312)"/>
    <!-- Palm 2 -->
    <rect x="930" y="325" width="5" height="80" fill="#0a1f10" transform="rotate(4,932,375)"/>
    <ellipse cx="930" cy="320" rx="30" ry="12" fill="#1a5a28" transform="rotate(20,930,320)"/>
    <ellipse cx="918" cy="313" rx="28" ry="10" fill="#1a5a28" transform="rotate(-15,918,313)"/>
    <ellipse cx="945" cy="315" rx="26" ry="9"  fill="#1a5a28" transform="rotate(35,945,315)"/>
    <ellipse cx="930" cy="307" rx="22" ry="8"  fill="#2d6b40" transform="rotate(-5,930,307)"/>
    <!-- Palm 3 (small, far left) -->
    <rect x="60"  y="345" width="4" height="60" fill="#0a1f10" transform="rotate(-5,62,375)"/>
    <ellipse cx="60"  cy="342" rx="22" ry="9" fill="#1a5a28" transform="rotate(-25,60,342)"/>
    <ellipse cx="70"  cy="336" rx="20" ry="8" fill="#1a5a28" transform="rotate(10,70,336)"/>
  </g>

  <!-- Ground detail: road / path -->
  <rect x="0"   y="390" width="1200" height="4" fill="#0a2010" opacity="0.6"/>
  <rect x="450" y="375" width="300" height="18" fill="#0e2818" opacity="0.5" rx="2"/>

  <!-- Adire-pattern decorative band at bottom -->
  <g opacity="0.55">
    <rect x="0"   y="458" width="1200" height="22" fill="#0f2e1a"/>
    <g fill="#c8860a">
      <rect x="0"   y="460" width="12" height="4"/><rect x="18"  y="460" width="6"  height="4"/>
      <rect x="30"  y="460" width="12" height="4"/><rect x="48"  y="460" width="6"  height="4"/>
      <rect x="60"  y="460" width="12" height="4"/><rect x="78"  y="460" width="6"  height="4"/>
      <rect x="90"  y="460" width="12" height="4"/><rect x="108" y="460" width="6"  height="4"/>
      <rect x="120" y="460" width="12" height="4"/><rect x="138" y="460" width="6"  height="4"/>
    </g>
  </g>

  <!-- Gold glow accent top-right -->
  <ellipse cx="1100" cy="80" rx="180" ry="90" fill="#c8860a" opacity="0.06"/>
</svg>
