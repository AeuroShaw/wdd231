<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a1a0a"/><stop offset="100%" stop-color="#2a2010"/></linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#sky5)"/>
  <!-- Market canopies -->
  <g>
    <polygon points="0,75 80,55 80,90 0,90" fill="#c8860a" opacity="0.85"/>
    <polygon points="70,65 155,48 155,85 70,85" fill="#8a3a10" opacity="0.85"/>
    <polygon points="145,70 230,52 230,88 145,88" fill="#c8860a" opacity="0.75"/>
    <polygon points="220,68 300,50 300,88 220,88" fill="#6a2810" opacity="0.85"/>
  </g>
  <!-- Cocoa House in background -->
  <rect x="130" y="20" width="40" height="50" fill="#1a3a28" opacity="0.7"/>
  <g fill="#e8b84b" opacity="0.2">
    <rect x="135" y="24" width="5" height="4"/><rect x="143" y="24" width="5" height="4"/><rect x="151" y="24" width="5" height="4"/><rect x="159" y="24" width="5" height="4"/>
    <rect x="135" y="32" width="5" height="4"/><rect x="143" y="32" width="5" height="4"/><rect x="151" y="32" width="5" height="4"/><rect x="159" y="32" width="5" height="4"/>
  </g>
  <!-- Stalls -->
  <rect x="0"   y="88" width="300" height="55" fill="#1a1205"/>
  <g fill="#2a2010">
    <rect x="5"   y="92" width="55" height="42"/><rect x="65"  y="92" width="55" height="42"/>
    <rect x="125" y="92" width="55" height="42"/><rect x="185" y="92" width="55" height="42"/>
    <rect x="245" y="92" width="50" height="42"/>
  </g>
  <!-- Goods: coloured fabric/produce blobs -->
  <g opacity="0.8">
    <ellipse cx="32"  cy="108" rx="18" ry="8" fill="#c8860a"/>
    <ellipse cx="92"  cy="110" rx="16" ry="7" fill="#1a8a40"/>
    <ellipse cx="152" cy="108" rx="18" ry="8" fill="#8a3a10"/>
    <ellipse cx="212" cy="110" rx="16" ry="7" fill="#c8860a"/>
    <ellipse cx="268" cy="108" rx="14" ry="7" fill="#1a4a8a"/>
  </g>
  <!-- People silhouettes -->
  <g fill="#0a0a05" opacity="0.7">
    <ellipse cx="50"  cy="147" rx="5" ry="8"/><rect x="47"  y="148" width="6" height="12"/>
    <ellipse cx="110" cy="145" rx="5" ry="8"/><rect x="107" y="146" width="6" height="12"/>
    <ellipse cx="170" cy="147" rx="5" ry="8"/><rect x="167" y="148" width="6" height="12"/>
    <ellipse cx="230" cy="145" rx="5" ry="8"/><rect x="227" y="146" width="6" height="12"/>
  </g>
  <rect x="0" y="160" width="300" height="40" fill="#0a0a05"/>
  <text x="150" y="185" font-family="Georgia,serif" font-size="11" fill="#c8860a" text-anchor="middle" font-weight="bold">DUGBE MARKET · IBADAN</text>
</svg>
