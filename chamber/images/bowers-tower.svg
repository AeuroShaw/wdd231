<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="sky6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#101a30"/><stop offset="100%" stop-color="#1a3a28"/></linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#sky6)"/>
  <!-- Panoramic city lights below -->
  <rect x="0" y="120" width="300" height="80" fill="#0a1408"/>
  <g fill="#e8b84b" opacity="0.3">
    <circle cx="20"  cy="140" r="2"/><circle cx="45"  cy="135" r="1.5"/><circle cx="70"  cy="142" r="2"/>
    <circle cx="100" cy="138" r="1.5"/><circle cx="130" cy="144" r="2"/><circle cx="160" cy="136" r="2"/>
    <circle cx="190" cy="143" r="1.5"/><circle cx="220" cy="138" r="2"/><circle cx="250" cy="141" r="1.5"/>
    <circle cx="275" cy="136" r="2"/><circle cx="35"  cy="150" r="1"/><circle cx="85"  cy="153" r="1"/>
    <circle cx="145" cy="155" r="1"/><circle cx="205" cy="152" r="1"/><circle cx="260" cy="150" r="1"/>
  </g>
  <!-- Hill -->
  <ellipse cx="150" cy="175" rx="180" ry="70" fill="#0d1e10"/>
  <!-- Tower base -->
  <rect x="132" y="100" width="36" height="72" fill="#2a4a30"/>
  <rect x="128" y="94"  width="44" height="12" fill="#1a3a22"/>
  <!-- Tower shaft -->
  <rect x="138" y="28" width="24" height="70" fill="#3a5a3a"/>
  <!-- Battlements top -->
  <g fill="#1a3a22">
    <rect x="136" y="20" width="8"  height="12"/><rect x="148" y="20" width="8"  height="12"/>
    <rect x="160" y="20" width="8"  height="12"/>
  </g>
  <rect x="136" y="26" width="32" height="4" fill="#2a4a30"/>
  <!-- Flag -->
  <rect x="149" y="6" width="2" height="16" fill="#c8860a"/>
  <rect x="151" y="6" width="14" height="9" fill="#1a8a40"/>
  <!-- Windows -->
  <g fill="#e8b84b" opacity="0.5">
    <rect x="142" y="38" width="8" height="6" rx="4"/><rect x="142" y="52" width="8" height="6" rx="4"/>
    <rect x="142" y="66" width="8" height="6" rx="4"/><rect x="142" y="80" width="8" height="6" rx="4"/>
  </g>
  <!-- Moon -->
  <circle cx="255" cy="38" r="16" fill="#f5e8a0" opacity="0.8"/>
  <circle cx="264" cy="32" r="12" fill="#1a3a28"/>
  <rect x="0" y="160" width="300" height="40" fill="#060e08"/>
  <text x="150" y="185" font-family="Georgia,serif" font-size="11" fill="#c8860a" text-anchor="middle" font-weight="bold">BOWER'S TOWER · IBADAN</text>
</svg>
