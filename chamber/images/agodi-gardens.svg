<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d2040"/><stop offset="60%" stop-color="#1a4060"/><stop offset="100%" stop-color="#1a5a3a"/></linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a4a6a"/><stop offset="100%" stop-color="#0a2838"/></linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#sky4)"/>
  <!-- Moon reflection -->
  <circle cx="220" cy="45" r="18" fill="#f5e8a0" opacity="0.85"/>
  <ellipse cx="220" cy="130" rx="12" ry="5" fill="#f5e8a0" opacity="0.25"/>
  <!-- Lake -->
  <ellipse cx="150" cy="138" rx="145" ry="45" fill="url(#lake)"/>
  <!-- Lake shimmer -->
  <g stroke="#6aaccc" stroke-width="1" opacity="0.25">
    <line x1="60" y1="132" x2="120" y2="130"/><line x1="150" y1="135" x2="220" y2="132"/>
    <line x1="80" y1="142" x2="140" y2="140"/><line x1="170" y1="145" x2="240" y2="142"/>
  </g>
  <!-- Trees -->
  <g fill="#0d3018">
    <ellipse cx="28" cy="105" rx="26" ry="30"/><ellipse cx="272" cy="103" rx="26" ry="30"/>
    <ellipse cx="58" cy="112" rx="20" ry="24"/><ellipse cx="242" cy="110" rx="20" ry="24"/>
    <ellipse cx="85" cy="108" rx="16" ry="20"/><ellipse cx="215" cy="106" rx="16" ry="20"/>
  </g>
  <!-- Trunks -->
  <g fill="#5a3010" opacity="0.6">
    <rect x="26" y="130" width="4" height="18"/><rect x="270" y="128" width="4" height="18"/>
    <rect x="56" y="132" width="3" height="14"/><rect x="240" y="130" width="3" height="14"/>
  </g>
  <!-- Pavilion on shore -->
  <polygon points="140,95 160,95 165,108 135,108" fill="#c8860a" opacity="0.8"/>
  <rect x="138" y="108" width="24" height="14" fill="#1a3a28"/>
  <rect x="143" y="112" width="14" height="10" fill="#0a2010"/>
  <!-- Ground -->
  <rect x="0" y="160" width="300" height="40" fill="#081410"/>
  <text x="150" y="185" font-family="Georgia,serif" font-size="11" fill="#c8860a" text-anchor="middle" font-weight="bold">AGODI GARDENS · IBADAN</text>
</svg>
