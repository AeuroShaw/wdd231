<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a1e28"/><stop offset="100%" stop-color="#1a3a30"/></linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#sky3)"/>
  <!-- Trees background -->
  <g fill="#0d2a18" opacity="0.8">
    <ellipse cx="30" cy="120" rx="28" ry="22"/><ellipse cx="270" cy="118" rx="28" ry="22"/>
    <ellipse cx="60" cy="125" rx="22" ry="18"/><ellipse cx="240" cy="123" rx="22" ry="18"/>
  </g>
  <!-- Main building -->
  <rect x="60" y="90" width="180" height="75" fill="#1e4228"/>
  <!-- Clock tower -->
  <rect x="128" y="38" width="44" height="90" fill="#2a5a3a"/>
  <rect x="122" y="30" width="56" height="14" fill="#1a4228"/>
  <!-- Clock face -->
  <circle cx="150" cy="56" r="14" fill="#f7f2e8"/>
  <circle cx="150" cy="56" r="12" fill="#fff"/>
  <line x1="150" y1="56" x2="150" y2="46" stroke="#0f2e1a" stroke-width="2"/>
  <line x1="150" y1="56" x2="157" y2="62" stroke="#0f2e1a" stroke-width="1.5"/>
  <!-- Arch entrance -->
  <rect x="135" y="122" width="30" height="43" fill="#0a1e14" rx="15" ry="0"/>
  <ellipse cx="150" cy="122" rx="15" ry="10" fill="#0a1e14"/>
  <!-- Wings -->
  <rect x="60" y="95" width="68" height="70" fill="#1a3a28"/>
  <rect x="172" y="95" width="68" height="70" fill="#1a3a28"/>
  <!-- Windows -->
  <g fill="#e8b84b" opacity="0.4">
    <rect x="75" y="105" width="10" height="8" rx="5"/><rect x="95" y="105" width="10" height="8" rx="5"/>
    <rect x="75" y="122" width="10" height="8" rx="5"/><rect x="95" y="122" width="10" height="8" rx="5"/>
    <rect x="185" y="105" width="10" height="8" rx="5"/><rect x="205" y="105" width="10" height="8" rx="5"/>
    <rect x="185" y="122" width="10" height="8" rx="5"/><rect x="205" y="122" width="10" height="8" rx="5"/>
  </g>
  <!-- Pinnacle -->
  <rect x="147" y="14" width="6" height="18" fill="#c8860a"/>
  <polygon points="150,8 155,16 145,16" fill="#c8860a"/>
  <rect x="0" y="160" width="300" height="40" fill="#081410"/>
  <text x="150" y="185" font-family="Georgia,serif" font-size="10" fill="#c8860a" text-anchor="middle" font-weight="bold">UNIVERSITY OF IBADAN · EST. 1948</text>
</svg>
