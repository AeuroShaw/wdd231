    <line x1="45" y1="50" x2="115" y2="120"/><line x1="115" y1="50" x2="45" y2="120"/>
  </g>
  <!-- Gondolas -->
  <g fill="#e8b84b" opacity="0.85">
    <rect x="74" y="28" width="12" height="8" rx="2"/>
    <rect x="74" y="134" width="12" height="8" rx="2"/>
    <rect x="22" y="80" width="12" height="8" rx="2"/>
    <rect x="123" y="80" width="12" height="8" rx="2"/>
    <rect x="39" y="43" width="10" height="7" rx="2"/>
    <rect x="106" y="122" width="10" height="7" rx="2"/>
    <rect x="106" y="43" width="10" height="7" rx="2"/>
    <rect x="39" y="122" width="10" height="7" rx="2"/>
  </g>
  <!-- Support -->
