  <!-- Ground lights -->
  <g fill="#e8b84b" opacity="0.6">
    <circle cx="155" cy="130" r="3"/><circle cx="175" cy="130" r="3"/><circle cx="195" cy="130" r="3"/>
    <circle cx="215" cy="130" r="3"/><circle cx="235" cy="130" r="3"/><circle cx="255" cy="130" r="3"/>
    <circle cx="275" cy="130" r="3"/>
