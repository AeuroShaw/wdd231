<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="sky8" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#050a20"/><stop offset="100%" stop-color="#101840"/></linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#sky8)"/>
  <!-- Ferris wheel -->
  <circle cx="80" cy="85" r="50" fill="none" stroke="#c8860a" stroke-width="3" opacity="0.9"/>
  <circle cx="80" cy="85" r="8" fill="#c8860a"/>
